# VeloGuardOS: OpenClaw's gateway (Kimi Claw, chat apps) is an AI agent like
# any other. Its `sudo` is VeloGuard's shim (each root command → your
# Approve/Deny), and the guard's pop-ups name it.
[Service]
Environment=VELOGUARD_AGENT=OpenClaw
Environment=PATH=/usr/share/veloguard/agents/bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin
