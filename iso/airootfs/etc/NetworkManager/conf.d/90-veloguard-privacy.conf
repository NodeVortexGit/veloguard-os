# VeloGuardOS zero trust: networks don't get to track this machine by its MAC.
# Scans use a random MAC; each Wi-Fi network sees its own stable random one
# (the same every time you join it, different from every other network).
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
