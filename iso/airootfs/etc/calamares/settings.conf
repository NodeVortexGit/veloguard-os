---
# VeloGuardOS — Calamares installer sequence (the one installer; archinstall
# and the terminal launcher are gone).
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     veloguarddesktop        # the "Desktop" page (branding/veloguarddesktop.qml)
  module: notesqml
  config: notesqml_veloguarddesktop.conf
- id:     veloguardcleanup
  module: shellprocess
  config: shellprocess_cleanup.conf
- id:     veloguardkernel
  module: shellprocess
  config: shellprocess_kernel.conf
- id:     veloguardnet
  module: shellprocess
  config: shellprocess_net.conf
- id:     veloguardhardware
  module: shellprocess
  config: shellprocess_hardware.conf
- id:     veloguardinstalldesktop
  module: shellprocess
  config: shellprocess_desktop.conf
- id:     veloguardapps
  module: shellprocess
  config: shellprocess_apps.conf
- id:     veloguardagents
  module: shellprocess
  config: shellprocess_agents.conf
- id:     veloguardagentpicker    # the "AI agents" page (branding/veloguardagents.qml)
  module: notesqml
  config: notesqml_veloguardagents.conf
- id:     veloguardlanguage       # the welcome page's language, for the whole system
  module: shellprocess
  config: shellprocess_language.conf
- id:     veloguardfinish
  module: shellprocess
  config: shellprocess_finish.conf

sequence:
- show:
  - welcomeq                        # our welcome page (branding/welcomeq.qml)
  - locale
  - keyboard
  - partition
  - notesqml@veloguarddesktop
  - notesqml@veloguardagentpicker   # which AI agents (Claude Code, Codex, Kimi Code ticked)
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@veloguardlanguage  # one language: the welcome page's (English by default)
  - shellprocess@veloguardcleanup   # strip live-ISO machinery + build the pacman keyring
  - shellprocess@veloguardkernel    # archiso keeps the kernel off the squashfs —
                                    #   copy vmlinuz into the target before mkinitcpio
  - shellprocess@veloguardnet       # DNS + mirrors inside the install chroot
  - shellprocess@veloguardhardware  # probe every component, install its drivers
  - shellprocess@veloguardinstalldesktop  # the desktop picked on the Desktop page
  - initcpiocfg                     # HOOKS for THIS disk layout (sd-encrypt for LUKS, lvm2, resume)
  - initcpio                        # AFTER drivers: picks up nvidia early-KMS etc.
  - services-systemd
  - grubcfg                         # /etc/default/grub: LUKS unlock + resume parameters, menu name
  - bootloader                      # AFTER drivers: grub-mkconfig sees the final kernel
  - shellprocess@veloguardapps      # default apps (best-effort, non-fatal)
  - shellprocess@veloguardagents    # VPN apps + AI agents (best-effort, non-fatal)
  - shellprocess@veloguardfinish    # nothing left running in the target, no stale lock
  - umount
- show:
  - finished

branding: veloguardos
prompt-install: true
dont-chroot: false
