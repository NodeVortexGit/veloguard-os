---
# VeloGuardOS — Calamares installer sequence (the one installer; archinstall
# and the terminal launcher are gone).
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     veloguarddesktop        # the "Desktop" page (branding/veloguarddesktop.qml)
  module: notesqml
  config: notesqml_veloguarddesktop.conf
- id:     veloguardcleanup
  module: shellprocess
  config: shellprocess_cleanup.conf
- id:     veloguardkernel
  module: shellprocess
  config: shellprocess_kernel.conf
- id:     veloguardnet
  module: shellprocess
  config: shellprocess_net.conf
- id:     veloguardhardware
  module: shellprocess
  config: shellprocess_hardware.conf
- id:     veloguardinstalldesktop
  module: shellprocess
  config: shellprocess_desktop.conf
- id:     veloguardapps
  module: shellprocess
  config: shellprocess_apps.conf
# - id:     veloguardai           # AI setup page (branding/veloguardai.qml) —
#   module: notesqml              #   re-enable at the AI-integration milestone,
#   config: notesqml_veloguardai.conf  # together with veloguardaijob below

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - notesqml@veloguarddesktop
  - users
# - notesqml@veloguardai
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@veloguardcleanup   # strip live-ISO machinery + build the pacman keyring
  - shellprocess@veloguardkernel    # archiso keeps the kernel off the squashfs —
                                    #   copy vmlinuz into the target before mkinitcpio
  - shellprocess@veloguardnet       # DNS + mirrors inside the install chroot
  - shellprocess@veloguardhardware  # probe every component, install its drivers
  - shellprocess@veloguardinstalldesktop  # the desktop picked on the Desktop page
  - initcpio                        # AFTER drivers: picks up nvidia early-KMS etc.
  - services-systemd
  - bootloader                      # AFTER drivers: grub-mkconfig sees the final kernel
# - veloguardaijob                  # applies the AI page's choices
  - shellprocess@veloguardapps      # default apps (best-effort, non-fatal)
  - umount
- show:
  - finished

branding: veloguardos
prompt-install: true
dont-chroot: false
