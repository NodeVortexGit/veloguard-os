---
# Give the install chroot a resolver and the live session's ranked mirrors
# (runs on the live system: it writes into ${ROOT}). Without it, every download
# in the steps after this one — drivers, the chosen desktop, apps — failed DNS.
dontChroot: true
timeout: 30
script:
  - command: "/opt/veloguard/provision/calamares-target-net.sh ${ROOT}"
i18n:
  name: "Connecting the new system to the network"
  name[bg]: "Свързване на новата система с мрежата"
