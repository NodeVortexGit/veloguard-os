# VeloGuardOS — initramfs hooks for the disk layout chosen on the Partitions
# page. Without this step an ENCRYPTED install has no unlock hook in its
# initramfs and cannot boot (and LVM / hibernate resume are missing too).
#
# systemd-based hooks, like Arch's own default mkinitcpio.conf (what the
# unencrypted install has always booted with): systemd … sd-vconsole, and
# sd-encrypt for LUKS. `base` is kept for the emergency shell.
---
useSystemdHook: true
hooks:
    prepend: [ base ]
source: "/etc/mkinitcpio.conf"
