---
# Install the VeloGuardOS default apps (Flatpaks: Brave, Discord, Dolphin,
# Viber, ZapZap, LibreOffice, Transmission) into the freshly-installed system.
# Runs in the target chroot — which has DNS since shellprocess@veloguardnet;
# before that every download here failed instantly, so this step "worked"
# offline only because it never fetched anything.
#
# Best-effort: the "-" prefix makes a failure OR a timeout (several GB on a
# slow link) non-fatal — `|| true` alone can't catch Calamares killing the
# command at the deadline, which would fail the whole installation at its
# very last step. Missing apps can be added later from GNOME Software.
dontChroot: false
timeout: 3600
verbose: true
script:
  - command: "-/opt/veloguard/provision/install-default-apps.sh"
    timeout: 3600
i18n:
  name: "Installing the default apps"
  name[bg]: "Инсталиране на приложенията по подразбиране"
