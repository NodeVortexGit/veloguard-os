# VeloGuardOS — /etc/default/grub for the installed system. Adds the kernel
# parameters an encrypted root needs (rd.luks.uuid=…, GRUB_ENABLE_CRYPTODISK)
# and resume= for a swap partition; names the menu entry after the product.
# Existing lines are edited, not replaced.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "loglevel=3", "quiet" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: false
