---
efi:
  mountPoint: "/boot/efi"
userSwapChoices: [ none, small ]
drawNestedPartitions: true
# Nothing pre-selected: "Erase disk" as the default was one careless Next
# away from wiping a machine that has data on it. The user picks.
initialPartitioningChoice: none
# Encrypted installs: /boot lives inside the encrypted root and GRUB unlocks
# it, which GRUB can do reliably only for LUKS1. Pinned so it can't drift.
luksGeneration: luks1
initialSwapChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]
