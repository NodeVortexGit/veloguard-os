---
# Detect every component (GPU, Wi-Fi, Bluetooth, laptop power/thermals,
# sensors, fingerprint, Thunderbolt…) and install its drivers into the target.
# Never fails the installation: offline, the first online boot finishes it.
dontChroot: false
timeout: 3600
verbose: true
script:
  - command: "-/opt/veloguard/provision/calamares-hardware.sh ${USER}"
i18n:
  name: "Installing drivers for this computer"
  name[bg]: "Инсталиране на драйвери за този компютър"
