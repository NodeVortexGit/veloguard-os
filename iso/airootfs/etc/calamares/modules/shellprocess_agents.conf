---
# The provider VPN apps (Proton, NordVPN, Surfshark) and the AI coding agents
# picked on the "AI agents" page (gs[veloguard_agents]; Claude Code, Codex and
# Kimi Code by default), for the account just created. Runs in the target chroot, which has
# DNS since shellprocess@veloguardnet.
#
# Best-effort, like the default apps: the "-" prefix makes a failure OR a
# timeout non-fatal (Calamares killing a step at its deadline would otherwise
# fail the whole installation at its very end). timeout(1) stops each script
# cleanly inside the deadline; whatever an agent step didn't finish is queued
# and installed on the first online boot (veloguard-agents-pending.service);
# Surfshark joins the default Flatpak queue.
dontChroot: false
timeout: 3600
verbose: true
script:
  - command: '-timeout -s INT -k 60 1400 /opt/veloguard/provision/install-vpn-apps.sh --user ${USER} --desktop ${gs[veloguard_desktop]}'
    timeout: 1500
  - command: '-timeout -s INT -k 60 1900 /opt/veloguard/provision/install-agents.sh --user ${USER} ${gs[veloguard_agents]}'
    timeout: 2000
i18n:
  name: "Installing the VPN apps and AI agents"
  name[bg]: "Инсталиране на VPN приложенията и AI агентите"
