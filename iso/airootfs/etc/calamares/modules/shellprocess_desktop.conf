---
# Install the desktop picked on the Desktop page. Clean Config builds its shell
# from source (~15 min); the others are official Arch packages. Never fails the
# installation: VeloGuard Hyprland is on the disc, and an offline choice is
# finished on the first online boot.
dontChroot: false
timeout: 5400
verbose: true
script:
  - command: "-/opt/veloguard/provision/calamares-desktop.sh ${gs[veloguard_desktop]} ${USER}"
i18n:
  name: "Installing your desktop"
  name[bg]: "Инсталиране на работната среда"
