---
# The installed system's language, all of it, from the welcome page's pick
# (English · Български · 日本語 → gs[veloguard_language]). Runs after the
# locale module wrote its own locale.conf, which took numbers, dates and units
# from the timezone (English text with Bulgarian formats); this makes it one
# language. en_US, bg_BG and ja_JP are always generated, so switching later is
# one line: `sudo localectl set-locale LANG=bg_BG.UTF-8`.
dontChroot: false
timeout: 300
script:
  - command: "-/opt/veloguard/provision/calamares-language.sh ${gs[veloguard_language]}"
    timeout: 300
i18n:
  name: "Setting the system language"
  name[bg]: "Задаване на езика на системата"
