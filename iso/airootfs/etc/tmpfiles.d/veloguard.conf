# /var/lib/veloguard — the guard's SYSTEM state (written as root by the
# NetworkManager hook, veloguard-wifi-trust and the updater). Traversable by
# path but not listable: the desktop session reads its world-readable mirrors
# (trusted-ssids, staged-kernel/pending.json, .setup-done) without a privileged
# call; everything else in it is root-only (memory.db is created 0600).
d /var/lib/veloguard 0711 root root -
# What the guard caught (honeypot captures, quarantined processes): admins read
# it — the desktop's "Investigate with an AI agent" — nobody else.
d /var/lib/veloguard/incidents 0750 root wheel -
