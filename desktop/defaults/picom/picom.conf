# VeloGuardOS — picom (the i3 compositor): Frost's translucent, frosted
# windows and bar. Blur needs OpenGL; without it picom falls back to plain
# translucency.
backend = "glx";
vsync = true;
shadow = false;
fading = true;
fade-delta = 6;
inactive-opacity = 0.80;
active-opacity = 0.88;
frame-opacity = 1.0;
inactive-opacity-override = false;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-exclude = [ "window_type = 'desktop'", "class_g = 'slop'" ];
opacity-rule = [
  "100:fullscreen",
  "100:class_g = 'vlc'",
  "100:class_g = 'mpv'",
  "100:class_g = 'i3lock'",
  "100:_NET_WM_STATE@[0]:32a = '_NET_WM_STATE_FULLSCREEN'"
];
detect-client-opacity = true;
use-damage = true;
