# VeloGuardOS guard binds for desktops that bring their own keymap (Clean
# Config). Only combos that config leaves free — its Print/lock/screenshot
# binds stay exactly as the user wrote them.
bind = SUPER SHIFT, G, exec, veloguard-guard-menu
bind = SUPER SHIFT, V, exec, veloguard-guard-menu vpn
bind = SUPER SHIFT, A, exec, veloguard-agent
bind = SUPER, ESCAPE, exec, veloguard-powermenu
bindl = , XF86PowerOff, exec, veloguard-powermenu
