; VeloGuardOS — polybar for i3: the same buttons as the VeloGuard top bar on
; Hyprland. Left: the guard menu (󰒃), workspaces, the window. Centre: the
; clock (click: the full date; right-click: a calendar). Right: AI plan
; usage, the guard (VPN / network trust / update / root grant), keyboard
; layout, Wi-Fi, Bluetooth, volume, brightness, power profile, battery, tray,
; notifications (dunst), the quick panel (󰒓).
;
; Started by veloguard-polybar (it fills in this machine's battery, adapter
; and Wi-Fi / wired interface). Colours: the active VeloGuard theme.
; This file is yours: edit freely; `polybar-msg cmd restart` reloads.

include-file = ~/.config/veloguard/generated/polybar-colors.ini

[bar/veloguard]
monitor = ${env:MONITOR:}
width = 100%
height = 26pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-bottom-size = 1
border-bottom-color = ${colors.accent}
padding-left = 1
padding-right = 0
module-margin = 1
separator =
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = Noto Sans CJK JP:size=10;3
font-2 = Noto Color Emoji:scale=10;2
modules-left = veloguard workspaces window
modules-center = date
modules-right = ${env:VG_MODULES:ai-usage guard xkeyboard wifi wired bluetooth pulseaudio backlight power-profile battery tray notifications quickpanel}
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

[settings]
screenchange-reload = true
pseudo-transparency = false

; ── left ───────────────────────────────────────────────────────────────────
[module/veloguard]
type = custom/text
format = 󰒃
format-foreground = ${colors.accent2}
format-padding = 1
click-left = veloguard-guard-menu &
click-right = albert toggle &

[module/workspaces]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = true
label-focused = 󱓻
label-focused-foreground = ${colors.accent2}
label-focused-padding = 1
label-unfocused =
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1
label-visible =
label-visible-padding = 1
label-urgent =
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1
label-mode = %mode%
label-mode-foreground = ${colors.warn}

[module/window]
type = internal/xwindow
label = %title:0:48:…%
label-foreground = ${colors.muted}

; ── centre ─────────────────────────────────────────────────────────────────
[module/date]
type = internal/date
interval = 5
date = %a %d %b  %H:%M
date-alt = %A, %d %B %Y — week %V
label = %date%
; click: the full date · right-click: a month calendar
format = %{A3:zenity --calendar --title=Calendar >/dev/null 2>&1 &:}<label>%{A}
format-foreground = ${colors.foreground}
format-padding = 1

; ── right ──────────────────────────────────────────────────────────────────
[module/ai-usage]
type = custom/script
exec = veloguard-bar ai-usage --polybar
interval = 30
click-left = veloguard-quickpanel --usage &
click-right = veloguard-agent &

[module/guard]
type = custom/script
exec = veloguard-bar guard --polybar
interval = 5
click-left = veloguard-guard-menu &
click-right = veloguard-guard-menu vpn &

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout>
label-layout = %layout%
label-layout-foreground = ${colors.foreground}

; Wi-Fi (click: the networks around you; right-click: nmtui) and wired;
; veloguard-polybar leaves out the one this machine doesn't have.
[module/wifi]
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{A1:veloguard-wifi-menu &:}%{A3:alacritty -e nmtui &:}<ramp-signal>%{A}%{A}
format-disconnected = %{A1:veloguard-wifi-menu &:}%{A3:alacritty -e nmtui &:}<label-disconnected>%{A}%{A}
label-disconnected = 󰤮
label-disconnected-foreground = ${colors.muted}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

[module/wired]
type = internal/network
interface-type = wired
interval = 5
format-connected = %{A1:veloguard-wifi-menu &:}%{A3:alacritty -e nmtui &:}<label-connected>%{A}%{A}
label-connected = 󰀂
format-disconnected =

[module/bluetooth]
type = custom/script
exec = veloguard-bar bluetooth --polybar
interval = 5
click-left = veloguard-bt-menu &
click-right = blueman-manager &

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟
label-muted-foreground = ${colors.muted}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-left = pavucontrol &
click-right = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

[module/backlight]
type = custom/script
exec = veloguard-bar backlight --polybar
interval = 5
scroll-up = brightnessctl -q s 5%+
scroll-down = brightnessctl -q s 5%-

[module/power-profile]
type = custom/script
exec = veloguard-bar power-profile --polybar
interval = 10
click-left = veloguard-bar --next-profile

[module/battery]
type = internal/battery
battery = ${env:VG_BAT:BAT0}
adapter = ${env:VG_ADP:AC}
full-at = 98
poll-interval = 5
format-charging = %{A1:veloguard-powermenu &:}󰂄 <label-charging>%{A}
format-discharging = %{A1:veloguard-powermenu &:}<ramp-capacity> <label-discharging>%{A}
format-full = %{A1:veloguard-powermenu &:}󰁹%{A}
label-charging = %percentage%%
label-discharging = %percentage%%
ramp-capacity-0 = 󰁺
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1 = 󰁼
ramp-capacity-1-foreground = ${colors.warn}
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-5 = 󰁹

[module/tray]
type = internal/tray
tray-size = 60%
tray-spacing = 10pt

; the bell: click for the list, right-click for do not disturb
[module/notifications]
type = custom/script
exec = veloguard-bar notifications --polybar
interval = 3
click-left = veloguard-session notifications &
click-right = veloguard-session dnd
click-middle = veloguard-session notifications clear

[module/quickpanel]
type = custom/text
format = 󰒓
format-background = ${colors.accent-glass}
format-padding = 2
click-left = veloguard-quickpanel &

; when there's no battery (a desktop PC, a VM) veloguard-polybar drops the
; battery module from the list
