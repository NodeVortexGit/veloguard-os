# VeloGuardOS idle management — derived from Omarchy config/hypr/hypridle.conf
# (MIT). Rewired from omarchy-* wrappers to stock hyprlock / loginctl, and
# veloguard-session for DPMS (it knows Hyprland's Lua dispatch and niri's
# own command — niri runs this same hypridle setup).

general {
    lock_cmd = pidof hyprlock || hyprlock                 # avoid duplicate lockers
    before_sleep_cmd = loginctl lock-session              # lock before suspend
    after_sleep_cmd = veloguard-session dpms on          # wake the display on resume
    inhibit_sleep = 3                                     # wait until locked
}

# Dim/lock after 5 minutes idle, DPMS off after 5.5 minutes.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = veloguard-session dpms off
    on-resume = veloguard-session dpms on
}
